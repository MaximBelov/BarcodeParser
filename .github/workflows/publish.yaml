name: Publishing

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC / npm Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Every push to master reaches this job, but only a release commit changes the
      # version. Without this check the publish fails on npm's 403 for an already
      # published version, which reads as a broken pipeline rather than as nothing
      # to release.
      - name: Check whether this version is new
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already published; nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: npm publish --access public --tag latest
